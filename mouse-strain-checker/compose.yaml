services:
  strain-checker:
    build: .
    ports:
      - "127.0.0.1:8502:8501"
    volumes:
      - ./data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8501/api/health', timeout=3))['app'] == 'mouse-strain-checker'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
